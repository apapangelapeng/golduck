[project]
name = "golduck-runner"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "flask==3.1.3",
    "gunicorn==26.0.0",
    "sortedcontainers==2.4.0",
    "wasmtime==47.0.1",
]

# Dev-only tooling; not installed by the Dockerfile.
[dependency-groups]
dev = [
    "mypy==2.3.0",
    "ruff==0.16.1",
]

[tool.ruff.lint]
# The runner deliberately funnels every failure of untrusted sim/guest
# code into a sanitized error response, so broad `except Exception`
# (BLE001) and `RuntimeError` for shape checks (TRY004) are intended.
ignore = ["BLE001", "TRY004"]
